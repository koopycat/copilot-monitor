version: 2
updates:
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3

  # pnpm uses one workspace lockfile at the repository root. Run Dependabot
  # from that root so manifest bumps and pnpm-lock.yaml stay atomic.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    groups:
      workspace-deps:
        patterns:
          - '*'
    ignore:
      # svelte-check 4 requires extra configuration for TypeScript 7.
      - dependency-name: 'typescript'
        versions: ['>=7']
